<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>制度確認キュー | Hojokin Compass</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#15263b;background:#f5f8fc}
*{box-sizing:border-box}body{margin:0}header{background:#123b62;color:white;padding:26px max(20px,calc((100vw - 1050px)/2))}
header h1{font-size:24px;margin:0 0 7px}header p{margin:0;color:#dcebf8;font-size:14px}
main{max-width:1050px;margin:auto;padding:24px 16px 64px}.notice{border-left:4px solid #cc8500;background:#fff8e8;padding:13px 17px;margin-bottom:20px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}input,select{border:1px solid #b9c7d6;border-radius:9px;background:white;padding:11px;font:inherit;min-height:43px}input{flex:1;min-width:190px}
#stats{font-size:14px;color:#41536b;margin:14px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:13px}
article{background:white;border:1px solid #d9e1ea;border-radius:13px;padding:17px;box-shadow:0 2px 7px #123b6209}
h2{font-size:17px;line-height:1.45;margin:9px 0}.meta{font-size:12px;color:#576c84;line-height:1.6}.tag{font-size:12px;background:#e8f1fb;border-radius:30px;padding:4px 9px;display:inline-block;margin:0 5px 5px 0}
.tag.high{background:#e6f5eb;color:#13673d}.tag.old{background:#fff0d6;color:#895900}.tag.dup{background:#eeeaf8;color:#5d478a}
p{line-height:1.65;font-size:14px}a{color:#145b9c;overflow-wrap:anywhere}footer{margin-top:30px;color:#60748b;font-size:13px}
</style></head>
<body><header><h1>制度確認キュー</h1><p>Hojokin Compass — 収集候補の確認作業用ビュー</p></header>
<main><div class="notice"><strong>掲載候補は未確認です。</strong> ここにある制度は現在募集中・申請可能・個人向けであることを保証しません。一般利用者向けの検索結果には含まれません。</div>
<div class="controls"><input id="search" type="search" placeholder="制度名・地域・対象者で検索" aria-label="制度候補を検索">
<select id="priority" aria-label="優先度"><option value="">すべての優先度</option><option value="高">優先確認</option><option value="要更新確認">年度の再確認</option><option value="終了要確認">終了制度の再確認</option><option value="通常">通常</option></select>
<select id="source" aria-label="収集元"><option value="">すべての収集元</option></select>
<select id="business" aria-label="対象"><option value="personal">個人向け候補を優先</option><option value="all">すべて</option><option value="business">事業者向けの可能性</option></select>
</div><div id="stats" role="status">読み込み中…</div><div id="cards" class="cards"></div>
<footer><a href="individual.html">一般向けの確認済み制度検索に戻る</a></footer></main>
<script>
"use strict";
const byId=id=>document.getElementById(id);
let candidates=[];
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function render(){
 const q=byId("search").value.trim().toLowerCase(),p=byId("priority").value,s=byId("source").value,b=byId("business").value;
 const selected=candidates.filter(x=>(!q||[x.title,x.area,x.target].some(v=>String(v||"").toLowerCase().includes(q)))&&(!p||x.review_priority===p)&&(!s||x.source_id===s)&&(b==="all"||(b==="business"?x.possible_business_only:!x.possible_business_only)));
 byId("stats").textContent="表示 "+selected.length+"件 / 確認待ち "+candidates.length+"件。優先確認 "+candidates.filter(x=>x.review_priority==="高").length+"件";
 const root=byId("cards");root.replaceChildren();
 for(const x of selected.slice(0,300)){
  const card=node("article"),meta=node("div",(x.area||"")+" · "+(x.source_id||""),"meta");card.append(meta);
  const tags=node("div");tags.append(node("span",x.review_priority||"通常","tag "+(x.review_priority==="高"?"high":["要更新確認","終了要確認"].includes(x.review_priority)?"old":"")));
  if(x.potentially_covered)tags.append(node("span","同じ公式ページの掲載済み制度あり","tag dup"));
  if(x.possible_business_only)tags.append(node("span","事業者向けの可能性","tag old"));
  card.append(tags,node("h2",x.title||"名称未設定"),node("p",x.target||"対象者未記載"));
  const a=node("a","公式データのリンクを確認 ↗");try{const u=new URL(x.source);if(u.protocol==="https:"){a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";card.append(a)}}catch(e){}
  root.append(card);
 }
 if(selected.length>300)root.append(node("p","表示は先頭300件までです。検索で絞り込んでください。"));
}
async function load(){try{const response=await fetch("public/data/individual_review_queue.json",{cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();candidates=Array.isArray(data.candidates)?data.candidates:[];const sources=[...new Set(candidates.map(x=>x.source_id).filter(Boolean))].sort();for(const s of sources){const o=node("option",s);o.value=s;byId("source").append(o)}render()}catch(e){byId("stats").textContent="候補データを読み込めませんでした: "+e.message}}
for(const id of ["search","priority","source","business"])byId(id).addEventListener("input",render);load();
</script></body></html>
