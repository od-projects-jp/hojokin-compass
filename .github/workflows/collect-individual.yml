
name: Collect Individual Support Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collect_municipal.py'
      - 'sources/individual_datasets.json'
      - '.github/workflows/collect-individual.yml'
  schedule:
    - cron: "20 20 * * *"

concurrency:
  group: individual-data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect individual support data
        run: |
          python collect_individual.py
          python individual_coverage.py

      - name: Collect municipal candidates (non-blocking)
        continue-on-error: true
        run: python collect_municipal.py

      - name: Build review queue
        run: python build_individual_review_queue.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/individual.json public/data/individual_review.json public/data/individual_coverage.json public/data/individual_review_queue.json
          if [ -f public/data/individual_collection_status.json ]; then
            git add public/data/individual_collection_status.json
          fi
          if [ -d public/data/individual_candidates ]; then
            git add -A public/data/individual_candidates
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update individual support data"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Concurrent update: regenerate outputs against latest main"
                git reset --hard origin/main
                python collect_individual.py
                python individual_coverage.py
                python collect_municipal.py || true
                python build_individual_review_queue.py
                git add public/data/individual.json public/data/individual_review.json public/data/individual_coverage.json
                if [ -f public/data/individual_collection_status.json ]; then git add public/data/individual_collection_status.json; fi
                if [ -d public/data/individual_candidates ]; then git add -A public/data/individual_candidates; fi
                if git diff --cached --quiet; then echo "Already up to date"; exit 0; fi
                git commit -m "Update individual support data"
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Push failed after 3 attempts"
                exit 1
              fi
              sleep 2
            done
          else
            echo "No changes to commit"
          fi
