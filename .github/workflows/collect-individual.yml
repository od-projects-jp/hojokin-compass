
name: Collect Individual Support Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect individual support data
        run: |
          python collect_individual.py
          python individual_coverage.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/individual.json public/data/individual_review.json public/data/individual_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Update individual support data"
            git push
          else
            echo "No changes to commit"
          fi
