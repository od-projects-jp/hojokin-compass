name: Browser UX Smoke Test
on:
  pull_request:
    paths:
      - 'individual.html'
      - 'search.html'
      - 'tests/browser_business_ux.py'
      - 'privacy-storage.js'
      - 'tests/browser_region_ux.py'
      - '.github/workflows/browser-ux.yml'
  workflow_dispatch:
jobs:
  browser-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test desktop and mobile interaction in Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/hojokin-http.log 2>&1 &
          python tests/browser_region_ux.py
          python tests/browser_business_ux.py
