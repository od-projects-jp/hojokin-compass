
name: Collect Subsidy Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect subsidy data
        run: python collector.py --detail-limit 30

      - name: Upload collection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hojokin-collection-results
          path: |
            hojokin.sqlite
            hojokin.report.json
          if-no-files-found: warn
          retention-days: 7
