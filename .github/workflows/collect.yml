
name: Collect Subsidy Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: write

concurrency:
  group: subsidy-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect subsidy data
        run: python collector.py --detail-limit 400

      - name: Export search data
        run: python export_search.py

      - name: Commit updated search data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/subsidies.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update subsidy search data"
            git push
          fi

      - name: Upload collection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hojokin-collection-results
          path: |
            hojokin.report.json
            public/data/subsidies.json
          if-no-files-found: warn
          retention-days: 7
