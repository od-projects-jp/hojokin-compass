name: Test Individual Data Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate immediate search feedback UX
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("individual.html").read_text(encoding="utf-8")
          assert html.index('id="result-preview"') < html.index('id="search-panel"')
          assert html.index('id="result-preview"') > html.index('class="topics"')
          for required in ('id="showMore"', 'id="resetTopic"', 'filtered.slice(0,3)', 'scrollIntoView({behavior:"smooth",block:"start"})', 'aria-live="polite"'):
              assert required in html, required
          assert 'google-site-verification' in Path("index.html").read_text(encoding="utf-8")
          print("Immediate results, progressive disclosure and verification validated")
          PY
      - name: Validate curated JSON
        run: python -c "import collect_individual; print(len(collect_individual.load_verified()), 'verified records')"
      - name: Validate published dataset and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collect_individual import load_verified
          from individual_coverage import build_coverage
          published = json.loads(Path("public/data/individual.json").read_text(encoding="utf-8"))
          records = published["subsidies"]
          verified = load_verified()
          if records != verified:
              print("Mismatch lengths", len(records), len(verified))
              for i, (a, b) in enumerate(zip(records, verified)):
                  if a != b:
                      print("First mismatch", i, a.get("title"), b.get("title"))
                      print("Published", a)
                      print("Verified", b)
                      break
              raise AssertionError("Published data differs from verified sources")
          assert published["total"] == len(verified), "Incorrect published count"
          coverage = json.loads(Path("public/data/individual_coverage.json").read_text(encoding="utf-8"))
          expected = build_coverage(records)
          for key in ("prefectures", "nationwide", "prefectures_with_records", "total_prefectures"):
              assert coverage[key] == expected[key], f"Coverage mismatch: {key}"
          print(f"Published {len(records)} validated records; coverage consistent")
          PY
      - name: Validate deadline report and published records
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from individual_deadlines import build_deadline_report
          from collect_individual import load_verified
          records = load_verified()
          for item in records:
              if item.get("application_deadline"):
                  date.fromisoformat(item["application_deadline"])
          report = json.loads(Path("public/data/individual_deadlines.json").read_text(encoding="utf-8"))
          expected = build_deadline_report(records, date.fromisoformat(report["as_of"]))
          assert report == expected, "Deadline report does not match curated records"
          print(f"{len(expected['programs'])} deadlines validated")
          PY
      - name: Validate static directory and sitemap
        run: |
          python - <<'PY'
          from html import escape
          from pathlib import Path
          from collect_individual import load_verified
          from build_individual_directory import build_directory
          records = load_verified()
          html = Path("individual-directory.html").read_text(encoding="utf-8")
          for item in records:
              assert escape(item["title"]) in html, "Missing directory record: " + item["title"]
          assert "個人向け支援制度一覧" in html
          assert "individual-directory.html" in Path("sitemap.xml").read_text(encoding="utf-8")
          assert len(records) == html.count('<article class="item">'), "Directory count mismatch"
          print(f"Static directory validated: {len(records)} records")
          PY
      - name: Validate organic guide and sitemap links
        run: |
          python - <<'PY'
          from pathlib import Path
          guide = Path("guide.html").read_text(encoding="utf-8")
          home = Path("index.html").read_text(encoding="utf-8")
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          assert '<link rel="canonical"' in guide
          assert "guide.html" in home and "guide.html" in sitemap
          assert "広告" in guide and "公式" in guide
          assert "<script" not in guide.lower()
          print("Guide and discoverability checks passed")
          PY
      - name: Check city eligibility filter and card design
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("individual.html").read_text(encoding="utf-8")
          assert 'city==="__all__"' in html
          assert 'city&&city!=="__other__"&&area===p+" "+city' in html
          assert "自治体限定制度も表示" not in html
          assert 'className="item-tags"' in html
          assert 'className="official-link"' in html
          assert 'className="item-details"' in html
          print("City eligibility default and readable cards validated")
          PY
      - name: Verify direct multi-region search controls
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("individual.html").read_text()
          for required in ['id="prefectureToggle"','id="prefectureMenu"','id="prefectureChoices"','selectedRegions=Array.isArray(initialFilters.regions)','regions:selectedRegions','regions.some(p=>area===p','id="closePrefectures"','setPrefectureMenu(false)','aria-expanded']:
              assert required in html,required
          assert 'area.startsWith(p+" ")' in html
          assert 'municipality.disabled=selectedRegions.length!==1' in html
          print("Direct multi-region selector checks passed")
          PY
      - name: Guard prefecture menu visibility and bulk selection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("individual.html").read_text(encoding="utf-8")
          css=html.split("</style>")[0]
          assert re.search(r'\.hero-search\s*\{[^}]*overflow\s*:\s*visible',css), "Hero must not clip menu"
          for selector in ['id="prefectureToggle"','id="prefectureMenu"','id="selectKanto"','id="selectAllPrefectures"','id="clearPrefectures"']:
              assert selector in html,selector
          assert 'prefectureMenu.hidden=!open' in html
          assert 'setSelectedPrefectures([...prefectures])' in html
          assert 'selectedRegions=region.value?[region.value]:[]' in html
          assert 'syncPrefectureChoices();' in html
          print("Visible menu, bulk controls, and filter synchronization validated")
          PY
      - name: Guard against tracking scripts and personal-data collection
        run: node tests/privacy-guardrails.test.js
      - name: Test browser-only storage and privacy controls
        run: node tests/browser-local-storage.test.js
      - name: Check privacy storage JavaScript syntax
        run: node --check privacy-storage.js
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          for page in ("individual.html", "individual-review.html", "search.html", "privacy.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
              assert scripts, f"No inline script found in {page}"
              for script in scripts:
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8") as tmp:
                      tmp.write(script)
                      tmp.flush()
                      subprocess.run(["node", "--check", tmp.name], check=True)
              print(page, "JavaScript syntax OK")
          PY
