name: Test Individual Data Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate curated JSON
        run: python -c "import collect_individual; print(len(collect_individual.load_verified()), 'verified records')"
      - name: Validate published dataset and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collect_individual import load_verified
          from individual_coverage import build_coverage
          published = json.loads(Path("public/data/individual.json").read_text(encoding="utf-8"))
          records = published["subsidies"]
          verified = load_verified()
          assert records == verified, "Published data differs from verified sources"
          assert published["total"] == len(verified), "Incorrect published count"
          coverage = json.loads(Path("public/data/individual_coverage.json").read_text(encoding="utf-8"))
          expected = build_coverage(records)
          for key in ("prefectures", "nationwide", "prefectures_with_records", "total_prefectures"):
              assert coverage[key] == expected[key], f"Coverage mismatch: {key}"
          print(f"Published {len(records)} validated records; coverage consistent")
          PY
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          for page in ("individual.html", "individual-review.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
              assert scripts, f"No inline script found in {page}"
              for script in scripts:
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8") as tmp:
                      tmp.write(script)
                      tmp.flush()
                      subprocess.run(["node", "--check", tmp.name], check=True)
              print(page, "JavaScript syntax OK")
          PY
